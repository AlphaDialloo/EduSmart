  payment-service:
    build:
      context: ./payment-service
    container_name: edusmart_payment_service
    restart: unless-stopped
    environment:
      PORT: 4009
      DATABASE_URL: postgresql://edusmart:edusmart_password@postgres:5432/edusmart_db
      JWT_SECRET: edusmart_secret_key
      INTERNAL_SERVICE_SECRET: edusmart_internal_service_secret
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:4008
      COURSE_SERVICE_URL: http://course-service:4003
      CORS_ORIGIN: "*"
    ports:
      - "4009:4009"
    depends_on:
      postgres:
        condition: service_healthy
      subscription-service:
        condition: service_started
