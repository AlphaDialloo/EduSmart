# Remplacez "your-org" par votre registre avant le déploiement.
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/your-org/edusmart-api-gateway:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - { configMapRef: { name: edusmart-config } }
            - { secretRef: { name: edusmart-secrets } }
          readinessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway }
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/your-org/edusmart-auth-service:latest
          ports: [{ containerPort: 4001 }]
          envFrom: [{ configMapRef: { name: edusmart-config } }, { secretRef: { name: edusmart-secrets } }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service }
spec: { selector: { app: auth-service }, ports: [{ port: 4001, targetPort: 4001 }] }
---
