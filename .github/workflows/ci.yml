name: EduSmart CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - course-service
          - progress-service
          - recommendation-service
          - interaction-service
          - settings-service
          - subscription-service
          - payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci
      - name: Check JavaScript syntax
        working-directory: ${{ matrix.service }}
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run service tests when present
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No automated tests declared for this service yet."
          fi

  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - directory: Frontend/student-web
            command: npm run build
          - directory: Frontend/edusmart-mobile
            command: npx expo export --platform web --output-dir dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - working-directory: ${{ matrix.directory }}
        run: npm ci
      - working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontends]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build service images
        run: docker compose build
      - name: Start stack and run smoke tests
        run: |
          docker compose up -d
          node scripts/smoke-test.mjs
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Validate Kustomize output
        run: kubectl kustomize k8s/base --load-restrictor LoadRestrictionsNone > /tmp/edusmart-manifest.yaml
